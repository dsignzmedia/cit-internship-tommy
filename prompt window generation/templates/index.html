<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome | Smart Design Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <style>
    .bg-animated {
      background: linear-gradient(270deg, #d8b4fe, #a5f3fc, #bfdbfe);
      background-size: 600% 600%;
      animation: gradientShift 10s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .hover-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .animate-fade-in {
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-animated min-h-screen flex flex-col items-center justify-center text-center px-4 py-10">

  <!-- Title -->
  <div class="bg-white p-10 rounded-3xl shadow-xl border border-purple-200 max-w-2xl animate-fade-in">
    <h1 class="text-4xl font-extrabold text-blue-800 mb-4">🪟 Smart Design Generator</h1>
    <p id="typedText" class="text-gray-600 text-lg mb-6 h-6"></p>
    
    <a href="/generator">
      <button class="bg-gradient-to-r from-blue-500 to-purple-500 text-white px-6 py-3 rounded-xl font-semibold hover:scale-105 transition transform duration-300">
        🚀 Get Started
      </button>
    </a>
  </div>

  <!-- Features -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16 max-w-4xl w-full px-4">
    <div class="bg-white p-6 rounded-xl shadow-md transition transform hover-card">
      <h2 class="text-xl font-bold text-blue-700 mb-2">📝 Describe</h2>
      <p class="text-gray-600">Type your design idea in natural language – like “4-panel french window with glass.”</p>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-md transition transform hover-card">
      <h2 class="text-xl font-bold text-purple-700 mb-2">🎨 Generate</h2>
      <p class="text-gray-600">See your idea converted into an actual image with frame, glass, and handles.</p>
    </div>
    <div class="bg-white p-6 rounded-xl shadow-md transition transform hover-card">
      <h2 class="text-xl font-bold text-green-700 mb-2">📥 Download</h2>
      <p class="text-gray-600">Download your design to share with your team or use in manufacturing.</p>
    </div>
  </div>

  <!-- Typing Effect -->
  <script>
    const typed = new Typed("#typedText", {
      strings: [
        "Design custom windows in seconds.",
        "Describe your dream door or window.",
        "Let AI create your architectural designs."
      ],
      typeSpeed: 50,
      backSpeed: 30,
      loop: true
    });
  </script>

</body>
</html>
